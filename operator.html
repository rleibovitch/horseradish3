<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Operator — Horseradish</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="operator-body">
    <a class="skip-link" href="#panel">Skip to panel</a>
    <header class="nav-wrap">
        <nav class="navbar" aria-label="Main">
            <a class="nav-logo" href="index.html">
                <img src="logo.png.png" alt="" class="logo-img">
                <span>Horseradish</span>
            </a>
            <a class="nav-link" href="index.html">Site</a>
        </nav>
    </header>

    <main id="panel" class="operator-page">
        <p class="eyebrow">Operator</p>
        <h1>Roni only.</h1>
        <p class="lede">The switch is this machine. No password. The public site does not link here.</p>

        <p class="stamp operator-card" id="away" hidden>
            Open this from your machine with <code>py server.py</code>.
        </p>

        <section id="board" class="stamp operator-card" hidden>
            <p class="agent-kicker" data-state-kicker>Presence</p>
            <p class="operator-state" data-state-label>Checking…</p>
            <button type="button" class="power" id="power" aria-pressed="false">
                <span class="power-track"><span class="power-knob"></span></span>
                <span class="power-text">Offline</span>
            </button>
            <p class="operator-msg" data-board-msg></p>
        </section>
    </main>

    <script>
    (function () {
        const board = document.getElementById("board");
        const away = document.getElementById("away");
        const power = document.getElementById("power");
        const boardMsg = document.querySelector("[data-board-msg]");
        const stateLabel = document.querySelector("[data-state-label]");
        const stateKicker = document.querySelector("[data-state-kicker]");
        const powerText = document.querySelector(".power-text");
        let online = false;

        function render(presence) {
            online = Boolean(presence && presence.online);
            power.setAttribute("aria-pressed", online ? "true" : "false");
            power.classList.toggle("is-on", online);
            powerText.textContent = online ? "Online" : "Offline";
            stateKicker.textContent = online ? "Live" : "Away";
            stateLabel.textContent = online
                ? "Horseradish is online."
                : "Horseradish is offline.";
        }

        function loadPresence() {
            return fetch("/api/presence", { cache: "no-store" })
                .then(function (res) { return res.json(); })
                .then(render)
                .catch(function () {
                    boardMsg.textContent = "Could not read presence.";
                });
        }

        fetch("/api/session", { cache: "no-store" })
            .then(function (res) { return res.ok ? res.json() : Promise.reject(); })
            .then(function (session) {
                if (!session || !session.local) {
                    throw new Error("remote");
                }
                away.hidden = true;
                board.hidden = false;
                loadPresence();
            })
            .catch(function () {
                board.hidden = true;
                away.hidden = false;
            });

        power.addEventListener("click", function () {
            const next = !online;
            boardMsg.textContent = "";
            fetch("/api/presence", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ online: next })
            }).then(function (res) {
                return res.json().then(function (body) {
                    if (!res.ok) {
                        boardMsg.textContent = body.error || "Could not flip.";
                        return;
                    }
                    render(body);
                });
            }).catch(function () {
                boardMsg.textContent = "Could not flip presence.";
            });
        });
    })();
    </script>
</body>
</html>
